apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels: {{- include "mcpg.labels" (dict "name" "dashboard") | nindent 4 }}
spec:
  selector: {{- include "mcpg.selector" "dashboard" | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: {{- include "mcpg.labels" (dict "name" "dashboard") | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels: {{- include "mcpg.selector" "dashboard" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mcpg.labels" (dict "name" "dashboard") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: {{ include "mcpg.image" (dict "root" . "name" "dashboard") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext: {{- include "mcpg.containerSecurity" . | nindent 12 }}
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            # let Traefik drop this pod before nginx stops, so a rollout has no 502s
            preStop:
              sleep: { seconds: 5 }
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  {{- include "mcpg.ingressAnnotations" . | nindent 2 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- include "mcpg.ingressTls" (dict "root" . "host" (include "mcpg.appHost" .) "secret" "app-tls") | nindent 2 }}
  rules:
    - host: {{ include "mcpg.appHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port: { number: 80 }
