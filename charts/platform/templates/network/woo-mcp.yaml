{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woo-mcp
spec:
  podSelector:
    matchLabels: {{- include "mcpg.selector" "woo-mcp" | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # only the gateway; the dashboard, wordpress and everything else time out
    - from:
        - podSelector:
            matchLabels: {{- include "mcpg.selector" "gateway" | nindent 14 }}
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "mcpg.selector" "wordpress" | nindent 14 }}
      ports:
        - { protocol: TCP, port: 80 }
{{- end }}
