{{- if .Values.networkPolicy.enabled }}
# gateway in, nothing out (DNS aside, from allow-dns)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-mcp
spec:
  podSelector:
    matchLabels: {{- include "mcpg.selector" "notes-mcp" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "mcpg.selector" "gateway" | nindent 14 }}
      ports:
        - { protocol: TCP, port: 3000 }
{{- end }}
