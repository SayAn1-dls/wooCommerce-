apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-content
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "mcpg.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels: {{- include "mcpg.labels" (dict "name" "wordpress") | nindent 4 }}
spec:
  selector: {{- include "mcpg.selector" "wordpress" | nindent 4 }}
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels: {{- include "mcpg.labels" (dict "name" "wordpress") | nindent 4 }}
spec:
  replicas: 1
  # wp-content is ReadWriteOnce, so never run old and new pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "mcpg.selector" "wordpress" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mcpg.labels" (dict "name" "wordpress") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wordpress
          image: {{ .Values.images.wordpress }}
          env:
            {{- include "mcpg.wordpressEnv" . | nindent 12 }}
            - name: WORDPRESS_CONFIG_EXTRA
              # egress to the internet is blocked, so fail fast instead of
              # waiting on update checks
              value: |
                define('WP_HTTP_BLOCK_EXTERNAL', true);
                define('AUTOMATIC_UPDATER_DISABLED', true);
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
          startupProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /wp-login.php, port: 80 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  {{- include "mcpg.ingressAnnotations" . | nindent 2 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- include "mcpg.ingressTls" (dict "root" . "host" (include "mcpg.shopHost" .) "secret" "shop-tls") | nindent 2 }}
  rules:
    - host: {{ include "mcpg.shopHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port: { number: 80 }
