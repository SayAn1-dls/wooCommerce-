{{- if not .Values.mariadb.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-auth
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  root-password: {{ include "mcpg.secretValue" (dict "root" $ "secret" "mariadb-auth" "key" "root-password") | b64enc }}
  password: {{ include "mcpg.secretValue" (dict "root" $ "secret" "mariadb-auth" "key" "password") | b64enc }}
---
{{- end }}
{{- if not .Values.wordpress.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-auth
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ include "mcpg.secretValue" (dict "root" $ "secret" "wordpress-auth" "key" "admin-password" "len" 20) | b64enc }}
  {{- /* fixed salts so a pod restart doesn't log everyone out of wp-admin */}}
  {{- range list "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
  {{ . }}: {{ include "mcpg.secretValue" (dict "root" $ "secret" "wordpress-auth" "key" . "len" 64) | b64enc }}
  {{- end }}
---
{{- end }}
{{- /*
woo-api is created here with no data at all and the store-setup Job fills it in.
The chart owns the object, so the Job only needs get/patch on this one name, not
create. Because the chart never renders any keys, an upgrade or a rollback to a
revision from before the key existed can't wipe what the Job wrote.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: woo-api
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
