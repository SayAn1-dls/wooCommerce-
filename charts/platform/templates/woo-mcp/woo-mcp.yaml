apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels: {{- include "mcpg.labels" (dict "name" "woo-mcp") | nindent 4 }}
spec:
  selector: {{- include "mcpg.selector" "woo-mcp" | nindent 4 }}
  ports:
    - name: http
      port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels: {{- include "mcpg.labels" (dict "name" "woo-mcp") | nindent 4 }}
spec:
  replicas: {{ .Values.wooMcp.replicas }}
  selector:
    matchLabels: {{- include "mcpg.selector" "woo-mcp" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mcpg.labels" (dict "name" "woo-mcp") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "mcpg.nodeSecurity" . | nindent 8 }}
      containers:
        - name: woo-mcp
          image: {{ include "mcpg.image" (dict "root" . "name" "woo-mcp") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext: {{- include "mcpg.containerSecurity" . | nindent 12 }}
          env:
            - name: WOO_URL
              value: http://wordpress
            - name: WOO_PUBLIC_URL
              value: {{ include "mcpg.shopUrl" . }}
            - name: WOO_SEND_PUBLIC_HOST
              value: {{ .Values.wooMcp.sendPublicHost | quote }}
            - name: STORE_TIMEZONE
              value: {{ .Values.storeTimezone }}
            - name: WOO_MCP_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "mcpg.gatewaySecret" . }}, key: WOO_MCP_TOKEN } }
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: woo-api
              mountPath: /etc/woo-api
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        # mounted as files, not env, so the key shows up once store-setup writes it
        - name: woo-api
          secret:
            secretName: woo-api
