{{- if not .Values.gateway.existingSecret }}
{{- $name := "gateway-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  SESSION_SECRET: {{ include "mcpg.secretValue" (dict "root" $ "secret" $name "key" "SESSION_SECRET" "len" 48) | b64enc }}
  GATEWAY_ENC_KEY: {{ include "mcpg.secretValue" (dict "root" $ "secret" $name "key" "GATEWAY_ENC_KEY" "len" 48) | b64enc }}
  WOO_MCP_TOKEN: {{ include "mcpg.secretValue" (dict "root" $ "secret" $name "key" "WOO_MCP_TOKEN" "len" 40) | b64enc }}
  NOTES_MCP_TOKEN: {{ include "mcpg.secretValue" (dict "root" $ "secret" $name "key" "NOTES_MCP_TOKEN" "len" 40) | b64enc }}
  SEED_ADMIN_EMAIL: {{ .Values.gateway.seedAdminEmail | b64enc }}
  {{- /* a password from --set wins, then the one already stored, then a random one */}}
  {{- if .Values.gateway.seedAdminPassword }}
  SEED_ADMIN_PASSWORD: {{ .Values.gateway.seedAdminPassword | b64enc }}
  {{- else }}
  SEED_ADMIN_PASSWORD: {{ include "mcpg.secretValue" (dict "root" $ "secret" $name "key" "SEED_ADMIN_PASSWORD" "len" 20) | b64enc }}
  {{- end }}
{{- end }}
